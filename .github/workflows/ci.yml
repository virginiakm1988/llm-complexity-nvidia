name: offline-scientific-checks
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - run: python -m project_demo demo --mode fixture --output-dir runs/ci
      - run: python -m project_demo evaluate --output-dir runs/ci
