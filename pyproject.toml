[build-system]
requires = ["setuptools>=77", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-complexity-nvidia"
version = "0.1.0"
description = "LLM Complexity with NVIDIA NIM — small-scale reproducible companion"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
dependencies = []

[project.optional-dependencies]
tutorial = ["ipywidgets==8.1.7", "matplotlib==3.10.6", "nbformat==5.10.4", "nbclient==0.10.2", "ipykernel==6.30.1"]
designer = ["data-designer==0.9.3"]
tokenizer = ["tokenizers==0.22.1", "huggingface-hub==0.35.3"]
legal = ["jieba==0.42.1", "rouge-score==0.1.2", "datasets==4.1.1"]

[project.scripts]
llm-complexity-nvidia = "project_demo.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["project_demo*"]

[tool.setuptools.package-data]
project_demo = ["data/*.jsonl", "data/*.json"]
